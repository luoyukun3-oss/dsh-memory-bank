# ============================================================================
# Memory Bank 钩子层（bundle 层 patch）—— 官方桌面版 0.2 专用副本
# ★ 这是**模板**，用前必须改下面两个路径
#
# 与 `bundle/cordis.patch.yml` 的差别只有注释：这份说明为什么必须走 bundle 层。
#
# ⚠️ profile 自己的 `cordis.patch.yml`（用户层）只能**覆盖/禁用已存在条目**，不能新增插件
#    —— 所以这份必须作为 bundle 层被挂进 profile 的 `dsh.profile.bundles`。
#
# ⚠️ 关键：新增条目必须写在 `insert:` 下面（理由同上）。
#
# ⚠️ 必须改成**绝对路径**，且路径里**不能有空格**。
# ⚠️ 包必须放在 **profile 内部**（理由见 `bundle/cordis.patch.yml` 的头注释）。
# ============================================================================
- insert:
    - id: mem-bank-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: '<改成你的绝对路径>/bank/hooks/hooks.json'
        projectDir: '<改成你的工作区绝对路径>'
        defaultTimeoutMs: 30000
